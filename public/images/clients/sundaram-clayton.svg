<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" role="img" aria-label="Sundaram Clayton Limited">
  <defs>
    <style>
      .scl-sub { font-family: Arial, sans-serif; font-size: 11px; fill: #666; letter-spacing: 2px; }
    </style>
  </defs>
  <!-- SCL emblem: gear-like hexagon -->
  <polygon points="45,22 63,32 63,52 45,62 27,52 27,32" fill="none" stroke="#1E3A5F" stroke-width="3"/>
  <polygon points="45,30 57,37 57,51 45,58 33,51 33,37" fill="#1E3A5F"/>
  <text x="45" y="50" text-anchor="middle" font-family="Arial" font-weight="800" font-size="14" fill="white">SCL</text>
  <!-- Wordmark -->
  <text x="85" y="50" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#1E3A5F">SUNDARAM</text>
  <text x="85" y="76" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#1E3A5F">CLAYTON</text>
  <text x="85" y="96" class="scl-sub">TVS GROUP · SINCE 1962</text>
</svg>
