<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" role="img" aria-label="Brakes India">
  <!-- Brakes India: blue wordmark, disc motif, white background -->
  <!-- Disc brake ring motif -->
  <circle cx="30" cy="40" r="22" fill="none" stroke="#003087" stroke-width="4"/>
  <circle cx="30" cy="40" r="10" fill="none" stroke="#003087" stroke-width="2.5"/>
  <circle cx="30" cy="40" r="4" fill="#003087"/>
  <!-- Spokes -->
  <line x1="30" y1="18" x2="30" y2="30" stroke="#003087" stroke-width="2"/>
  <line x1="30" y1="50" x2="30" y2="62" stroke="#003087" stroke-width="2"/>
  <line x1="8" y1="40" x2="20" y2="40" stroke="#003087" stroke-width="2"/>
  <line x1="40" y1="40" x2="52" y2="40" stroke="#003087" stroke-width="2"/>
  <!-- Wordmark -->
  <text x="128" y="35" font-family="'Arial Black','Helvetica Neue',sans-serif" font-size="16" font-weight="900" fill="#003087" text-anchor="middle" letter-spacing="1">BRAKES</text>
  <text x="128" y="54" font-family="'Arial Black','Helvetica Neue',sans-serif" font-size="16" font-weight="900" fill="#003087" text-anchor="middle" letter-spacing="1">INDIA</text>
  <text x="128" y="67" font-family="Arial,sans-serif" font-size="7.5" fill="#555" text-anchor="middle" letter-spacing="1">TVS GROUP</text>
</svg>
