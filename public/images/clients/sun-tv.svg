<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" role="img" aria-label="Sun TV">
  <!-- Sun TV Network: yellow sun + red wordmark, white background -->
  <!-- Sun rays -->
  <g transform="translate(36,40)">
    <circle r="14" fill="#FFD700"/>
    <line x1="0" y1="-22" x2="0" y2="-17" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="17" x2="0" y2="22" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="-22" y1="0" x2="-17" y2="0" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="17" y1="0" x2="22" y2="0" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="-15" x2="-11" y2="-11" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="11" y1="11" x2="15" y2="15" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15" y1="-15" x2="11" y2="-11" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-11" y1="11" x2="-15" y2="15" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="128" y="36" font-family="'Arial Black',sans-serif" font-size="22" font-weight="900" fill="#E31837" text-anchor="middle">SUN</text>
  <text x="128" y="61" font-family="'Arial Black',sans-serif" font-size="22" font-weight="900" fill="#E31837" text-anchor="middle">TV</text>
</svg>
