<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Card -->
  <rect x="60" y="60" width="1080" height="1080" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Center Decorative Icon Container -->
  <circle cx="600" cy="520" r="140" fill="#eff6ff"/>
  
  <!-- Office Package Graphic -->
  <g transform="translate(480, 400)" stroke="url(#iconGrad)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 30 70 L 60 30 L 180 30 L 210 70 L 230 70 C 241 70 250 79 250 90 L 250 200 C 250 211 241 220 230 220 L 10 220 C -1 220 -10 211 -10 200 L -10 90 C -10 79 -1 70 10 70 Z" fill="#ffffff"/>
    <circle cx="120" cy="145" r="45" fill="#eff6ff" stroke="url(#iconGrad)" stroke-width="12"/>
    <circle cx="120" cy="145" r="16" fill="#2563eb"/>
    <circle cx="195" cy="100" r="8" fill="#2563eb"/>
  </g>

  <!-- Brand Title -->
  <text x="600" y="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="4">OFFICEBAZZAR</text>

  <!-- Corporate Tagline -->
  <text x="600" y="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2">CORPORATE PROCUREMENT</text>
</svg>
